<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard - Books Library</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .back-link {
            color: #007bff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #0056b3;
        }
        
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        
        .sales-table {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .sales-table h2 {
            padding: 20px;
            margin: 0;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        
        .sorting-controls {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .sort-btn {
            background: white;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #495057;
        }
        
        .sort-btn:hover {
            background: #e9ecef;
            border-color: #ced4da;
            transform: translateY(-1px);
        }
        
        .sort-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .sort-indicator {
            font-size: 10px;
            opacity: 0.7;
        }
        
        .sort-indicator.asc::after {
            content: "▲";
        }
        
        .sort-indicator.desc::after {
            content: "▼";
        }
        
        .sales-table table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .sales-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #dee2e6;
        }
        
        .sales-table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .sales-table tr:hover {
            background: #f8f9fa;
        }
        
        .sales-table tr:last-child td {
            border-bottom: none;
        }
        
        .category-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            background: #e9ecef;
            color: #495057;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1><i class="fas fa-chart-line"></i> Sales Dashboard</h1>
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Library
            </a>
        </div>
        
        <div class="stats-summary" id="stats-summary">
            <div class="stat-card">
                <h3>Total Books Sold</h3>
                <div class="value" id="total-books-sold">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Revenue</h3>
                <div class="value" id="total-revenue">$0.00</div>
            </div>
            <div class="stat-card">
                <h3>Unique Titles Sold</h3>
                <div class="value" id="unique-titles">0</div>
            </div>
        </div>
        
        <div class="sales-table">
            <h2>Most Sold Books</h2>
            <div class="sorting-controls">
                <button class="sort-btn active" data-sort="total_sold" data-order="desc" onclick="sortTable('total_sold')">
                    Most Sold <span class="sort-indicator desc"></span>
                </button>
                <button class="sort-btn" data-sort="title" data-order="asc" onclick="sortTable('title')">
                    Title <span class="sort-indicator"></span>
                </button>
                <button class="sort-btn" data-sort="author" data-order="asc" onclick="sortTable('author')">
                    Author <span class="sort-indicator"></span>
                </button>
                <button class="sort-btn" data-sort="revenue" data-order="desc" onclick="sortTable('revenue')">
                    Revenue <span class="sort-indicator"></span>
                </button>
            </div>
            <div id="table-container">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading sales data...
                </div>
            </div>
        </div>
    </div>
    
    <script>
        async function loadSalesData() {
            try {
                const response = await fetch('/dashboard/sold-books');
                if (!response.ok) {
                    throw new Error('Failed to fetch sales data');
                }
                
                const data = await response.json();
                displaySalesData(data);
                updateStatistics(data);
            } catch (error) {
                document.getElementById('table-container').innerHTML = 
                    `<div class="error">Error loading sales data: ${error.message}</div>`;
            }
        }
        
        function displaySalesData(books) {
            const container = document.getElementById('table-container');
            
            if (books.length === 0) {
                container.innerHTML = '<div class="no-data">No sales data available yet.</div>';
                return;
            }
            
            const tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Quantity Sold</th>
                            <th>Revenue</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${books.map((book, index) => `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${book.title}</td>
                                <td>${book.author}</td>
                                <td><span class="category-badge">${book.category}</span></td>
                                <td>$${book.price.toFixed(2)}</td>
                                <td>${book.total_sold}</td>
                                <td><strong>$${book.revenue.toFixed(2)}</strong></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            container.innerHTML = tableHTML;
        }
        
        function updateStatistics(books) {
            const totalBooksSold = books.reduce((sum, book) => sum + book.total_sold, 0);
            const totalRevenue = books.reduce((sum, book) => sum + book.revenue, 0);
            const uniqueTitles = books.length;
            
            document.getElementById('total-books-sold').textContent = totalBooksSold;
            document.getElementById('total-revenue').textContent = `$${totalRevenue.toFixed(2)}`;
            document.getElementById('unique-titles').textContent = uniqueTitles;
        }
        
        // Global variable to store current data
        let currentSalesData = [];
        
        function sortTable(sortBy) {
            if (currentSalesData.length === 0) return;
            
            // Get current button and order
            const button = document.querySelector(`[data-sort="${sortBy}"]`);
            const currentOrder = button.dataset.order;
            
            // Remove active class from all buttons
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.querySelector('.sort-indicator').className = 'sort-indicator';
            });
            
            // Sort the data
            const sortedData = [...currentSalesData].sort((a, b) => {
                let aValue = a[sortBy];
                let bValue = b[sortBy];
                
                // Handle string sorting
                if (typeof aValue === 'string') {
                    aValue = aValue.toLowerCase();
                    bValue = bValue.toLowerCase();
                }
                
                if (currentOrder === 'asc') {
                    return aValue > bValue ? 1 : -1;
                } else {
                    return aValue < bValue ? 1 : -1;
                }
            });
            
            // Toggle order for next click
            const newOrder = currentOrder === 'asc' ? 'desc' : 'asc';
            button.dataset.order = newOrder;
            
            // Update button appearance
            button.classList.add('active');
            const indicator = button.querySelector('.sort-indicator');
            indicator.classList.add(currentOrder);
            
            // Display sorted data
            displaySalesData(sortedData);
        }
        
        // Modified loadSalesData to store data globally
        async function loadSalesData() {
            try {
                const response = await fetch('/dashboard/sold-books');
                if (!response.ok) {
                    throw new Error('Failed to fetch sales data');
                }
                
                const data = await response.json();
                currentSalesData = data; // Store data globally
                displaySalesData(data);
                updateStatistics(data);
            } catch (error) {
                document.getElementById('table-container').innerHTML = 
                    `<div class="error">Error loading sales data: ${error.message}</div>`;
            }
        }
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadSalesData);
    </script>
</body>
</html>
