<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalog</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
</head>
<body>
    <div id="app">
        <div v-for="book in books" :key="book.id" class="book-item">
            <img :src="book.cover_image_url || placeholderImage" alt="Book Cover" @error="imageLoadError(book)" />
            <h3>{{ book.title }}</h3>
            <p>{{ book.author }}</p>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    books: [],
                    placeholderImage: 'path/to/placeholder/image.jpg',
                    errorImage: 'path/to/default/error/image.jpg'
                };
            },
            created() {
                this.fetchBooks();
            },
            methods: {
                async fetchBooks() {
                    const response = await fetch('/books/');
                    this.books = await response.json();
                },
                imageLoadError(book) {
                    book.cover_image_url = this.errorImage;
                }
            }
        });
    </script>
</body>
</html>
