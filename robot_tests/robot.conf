# Robot Framework Test Configuration
# Based on GitLab CI/CD pipeline requirements and best practices

# Test Execution Settings
--outputdir robot_results
--loglevel INFO
--report robot_results/report.html
--log robot_results/log.html
--output robot_results/output.xml

# Browser Settings for UI Tests
--variable BROWSER:chromium
--variable HEADLESS:true
--variable TIMEOUT:10s
--variable SLOW_TIMEOUT:30s

# Application URLs (can be overridden via environment)
--variable BASE_URL:http://localhost:8000
--variable API_BASE_URL:http://localhost:8000/books
--variable UI_URL:http://localhost:8000

# Test Data Settings
--variable TEST_BOOK_TITLE:Test Book Title
--variable TEST_BOOK_AUTHOR:Test Author
--variable TEST_BOOK_PAGES:250
--variable TEST_BOOK_CATEGORY:Fiction

# Test Execution Options
--exitonfailure
--randomize tests
--maxerrorlines 10

# Reporting Options
--timestampoutputs
--splitlog
--logtitle "Books Library Test Results"
--reporttitle "Books Library Test Report"

# Tag-based execution examples:
# --include smoke          # Run only smoke tests
# --include critical       # Run only critical tests
# --include api           # Run only API tests
# --include ui            # Run only UI tests
# --exclude slow          # Exclude slow tests