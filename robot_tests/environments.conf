# Environment-specific Robot Framework configurations

# Local Development Environment
[local]
--variable BASE_URL:http://localhost:8000
--variable BROWSER:chromium
--variable HEADLESS:false
--variable TIMEOUT:10s
--loglevel DEBUG

# CI/CD Environment
[ci]
--variable BASE_URL:http://books-database-service:8000
--variable BROWSER:chromium
--variable HEADLESS:true
--variable TIMEOUT:30s
--loglevel INFO
--exitonfailure

# Staging Environment
[staging]
--variable BASE_URL:http://staging.books-library.com
--variable BROWSER:chromium
--variable HEADLESS:true
--variable TIMEOUT:15s
--loglevel INFO

# Production Smoke Tests
[production]
--variable BASE_URL:http://books-library.com
--variable BROWSER:chromium
--variable HEADLESS:true
--variable TIMEOUT:20s
--include smoke
--loglevel INFO
--exitonfailure